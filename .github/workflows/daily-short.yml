name: Daily Hindi YouTube Short

on:
  workflow_dispatch:
  # schedule:
  #   # 09:00 UTC = 14:30 IST. GitHub schedule may start late.
  #   - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: daily-youtube-short
  cancel-in-progress: false

jobs:
  create-and-upload:
    # Ubuntu hosted runner. Public repos get standard runner minutes free;
    # private repos are subject to the account's included minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate, render and upload
       env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
  YOUTUBE_EXPECTED_CHANNEL_NAME: ${{ secrets.YOUTUBE_EXPECTED_CHANNEL_NAME }}
  YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
