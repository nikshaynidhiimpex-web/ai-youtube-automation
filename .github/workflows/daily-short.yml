name: Daily Hindi YouTube Short

on:
  workflow_dispatch:
    inputs:
      privacy:
        description: "Test ke liye private. 'public' = analytics wale best time par schedule"
        type: choice
        options: [private, unlisted, public]
        default: private
      force:
        description: "Aaj ki public video ban chuki ho tab bhi nayi banao"
        type: boolean
        default: false
  schedule:
    # Video roz 06:00 IST (00:30 UTC) par banti hai.
    # PUBLISH ka time har din alag hota hai: script analytics dekh kar
    # best slot chunti hai aur YouTube par schedule kar deti hai.
    - cron: "30 0 * * *"

permissions:
  contents: write   # data/history.json (analytics memory) save karne ke liye

concurrency:
  group: daily-youtube-short
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Analyse, generate, render and upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_EXPECTED_CHANNEL_NAME: ${{ secrets.YOUTUBE_EXPECTED_CHANNEL_NAME }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          PUBLISH_SLOTS_IST: ${{ vars.PUBLISH_SLOTS_IST }}
          PUBLISH_MODE: ${{ github.event_name == 'schedule' && 'public' || inputs.privacy }}
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
        run: python main.py

      - name: Keep video for review (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: |
            output/short.mp4
            output/thumbnail.jpg
            output/script.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Save analytics memory
        if: always()
        run: |
          if [ ! -f data/history.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "No analytics changes."
          else
            git commit -m "Update video analytics history"
            git pull --rebase
            git push
          fi
